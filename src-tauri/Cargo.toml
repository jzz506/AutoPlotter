[package]
name = "autoplotter"
version = "1.0.0"
description = "本地可视化自动数据分析与绘图"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "autoplotter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
